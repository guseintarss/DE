# =============================================================================
# Конфигурация Wayfire для DE.
#
# Это «шаблон»: по сравнению со старым config.toml (композитор на wlroots)
# конфиг wayfire совмещает и ввод, и рабочие столы, и горячие клавиши, и
# автозапуск оболочки. При старте session/run-de.sh подставляет @DE_ROOT@
# (корень репозитория) в команды автозапуска и записывает итоговый файл
# в build/run/wayfire.ini, а композитору указывает его через WAYFIRE_CONFIG_FILE.
#
# Горячие клавиши перенесены из legacy/config.toml:
#   super+Return          — терминал (alacritty)
#   super+Shift+Q / alt+F4 — закрыть окно
#   super+Shift+E         — выход из сессии
#   super+L               — экранный блокировщик
#   super+Tab / alt+Tab   — циклическое переключение окон
#   super+стрелки         — укладка/перемещение окна (grid)
#   супер+мышь            — движение/изменение размера (move/resize)
# =============================================================================

# ─── Ввод ────────────────────────────────────────────────────────────────────

[input]
xkb_layout = us

# ─── Ядро ────────────────────────────────────────────────────────────────────

[core]

# Плагины DE: анимации, декорации, укладка, рабочие столы, IPC для шелла.
plugins = \
  alpha \
  animate \
  autostart \
  blur \
  command \
  cube \
  decoration \
  expo \
  ext-toplevel \
  fast-switcher \
  foreign-toplevel \
  grid \
  gtk-shell \
  idle \
  ipc \
  ipc-rules \
  move \
  place \
  resize \
  scale \
  session-lock \
  shortcuts-inhibit \
  simple-tile \
  switcher \
  vswitch \
  wayfire-shell \
  window-rules \
  wm-actions \
  wobbly \
  wrot \
  zoom

# Рабочие столы: сетка 2×2 (как «рабочие столы» старого композитора).
vwidth = 2
vheight = 2

# Закрыть сфокусированное окно (legacy: super+Shift+q, alt+F4).
close_top_view = <super> <shift> KEY_Q | <alt> KEY_F4

# Выход из композитора (legacy: super+Shift+e).
exit = <super> <shift> KEY_E

# Обои в один тон, пока не появился de-wallpaper.
background_color = 0.055 0.055 0.067 1.0

# Предпочитаем собственные (клиентские) заголовки; для XWayland и окон без
# CSD wayfire нарисует серверные.
preferred_decoration_mode = client

# ─── Анимации (macOS-стиль, как в legacy config.toml [animations]) ──────────

[animate]
open_animation = zoom
close_animation = zoom
duration = 380ms
startup_duration = 250ms linear

[blur]
# Лёгкое размытие окон — эффект «стекло» (нужен GLES2). По умолчанию
# blur_by_default = "type is toplevel"; здесь можно задать свои условия.
method = box

# ─── Горячие клавиши приложений ──────────────────────────────────────────────

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = alacritty
binding_lock = <super> KEY_L
command_lock = swaylock

# ─── Перемещение окон мышью ──────────────────────────────────────────────────

[move]
activate = <super> BTN_LEFT
enable_snap = true
snap_threshold = 10

[resize]
activate = <super> BTN_RIGHT

# ─── Укладка окна (legacy: super+стрелки = @move) ────────────────────────────

[grid]
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT
slot_t = <super> KEY_UP
restore = <super> KEY_DOWN

# ─── Оконные действия ────────────────────────────────────────────────────────

[wm-actions]
toggle_maximize = <super> KEY_M
toggle_fullscreen = <super> KEY_F
toggle_always_on_top = <super> KEY_X
minimize = <super> KEY_MINUS
toggle_showdesktop = <super> KEY_D

# ─── Переключение окон ───────────────────────────────────────────────────────

# macOS-стиль: Alt+Tab — свитчер активного окна (Cmd+Tab), Super+Tab — масштаб
# всех окон (как Exposé/App Switcher в полный список).
[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB

[fast-switcher]
# Задействован Super+Tab под scale; при желании включить быстрый свитчер —
# задать activate = <super> KEY_SPACE и убрать KEY_SPACE из [expo].
activate = <alt> KEY_GRAVE

# Scale: все окна рабочего стола (Super+Tab).
# Note: один биндинг на опцию; Super+Tab больше не занят fast-switcher.
[scale]
toggle = <super> KEY_TAB

[expo]
# Mission Control — обзор рабочих столов (Super+Space).
toggle = <super> KEY_SPACE

# ─── Рабочие столы (vswitch) ─────────────────────────────────────────────────

[vswitch]
binding_left = <ctrl> <super> KEY_LEFT
binding_right = <ctrl> <super> KEY_RIGHT
binding_up = <ctrl> <super> KEY_UP
binding_down = <ctrl> <super> KEY_DOWN
with_win_left = <ctrl> <super> <shift> KEY_LEFT
with_win_right = <ctrl> <super> <shift> KEY_RIGHT
with_win_up = <ctrl> <super> <shift> KEY_UP
with_win_down = <ctrl> <super> <shift> KEY_DOWN

# ─── OSD/эффекты ─────────────────────────────────────────────────────────────

[zoom]
modifier = <super>

[alpha]
modifier = <super> <alt>

[wrot]
activate = <super> <ctrl> BTN_RIGHT

# ─── Автозапуск ──────────────────────────────────────────────────────────────
#
# wayfire разворачивается в указанном ниже порядке; оболочка и обои поднимаются
# автоматически при старте сессии (legacy: [shell] start = "qs ...").
# de-wallpaper ищется в PATH (build/de/bin), куда его ставит meson install.

[autostart]
shell = qs -p @DE_ROOT@/ui/quickshell
wallpaper = de-wallpaper
autostart_wf_shell = false