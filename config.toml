# Конфигурация MyWM (Этап 4).
# Пути поиска: $DE_CONFIG -> $XDG_CONFIG_HOME/de/config.toml
#              -> ~/.config/de/config.toml -> config.toml (текущий каталог).
# Если файл не найден — используются встроенные значения по умолчанию.

# Раскладка XKB (правила evdev, модель pc105).
layout = "us"

# --- Этап 5: обои ---
# path — файл изображения (PNG/JPEG/BMP/GIF/TGA); пусто — встроенные
#        обои из assets/wallpaper.png.
# mode — cover (заполнить с обрезкой, по умолчанию) | stretch | fit | tile
[wallpaper]
path = ""
mode = "cover"

# --- Этап 5: анимации ---
# enabled     — spring-анимации открытия/закрытия (macOS-стиль).
# stiffness   — жёсткость пружины (170 по умолчанию).
# damping     — затухание (26 по умолчанию, ~критическое).
# open_slide  — сдвиг вниз при открытии (px).
# close_slide — сдвиг вверх при закрытии (px).
[animations]
enabled = true
stiffness = 100.0
damping = 15.0
open_slide = 8
close_slide = 8

# Горячие клавиши: "<модификаторы>+<keysym>" = действие.
# Модификаторы: super, shift, ctrl, alt.
# Действия:
#   "команда"        — запуск приложения через fork/execvp (без шелла)
#   "@close"         — закрыть сфокусированное окно
#   "@exit"          — выйти из композитора
#   "@cycle"         — переключить фокус между окнами
#   "@lock [команда]"— запустить экранный блокировщик
#   "@move <dir>"    — переместить окно (up/down/left/right)
#   "@resize <dir>"  — изменить размер окна (up/down/left/right)
[bindings]
"super+Return" = "alacritty"
"super+Shift+q" = "@close"
"super+Shift+e" = "@exit"
"super+l" = "@lock swaylock"
"super+Tab" = "@cycle"
"alt+Tab" = "@cycle"
"alt+F4" = "@close"
"super+Left" = "@move left"
"super+Right" = "@move right"
"super+Up" = "@move up"
"super+Down" = "@move down"
"super+Shift+Left" = "@resize left"
"super+Shift+Right" = "@resize right"
"super+Shift+Up" = "@resize up"
"super+Shift+Down" = "@resize down"
# --- Оболочка ---
# builtin = true  — менюбар и док рисует сам композитор (bar.c/dock.c).
# builtin = false — встроенная оболочка выключена; верхнюю панель/док
#                   рисует внешняя оболочка через layer-shell.
# start — команда оболочки, запускаемая автоматически при старте DE
#         (только при builtin = false). Пусто/отсутствует — не запускать.
[shell]
builtin = false
start = "qs -p ui/quickshell"

# --- Дизайн оболочки ---
# Все цвета: hex "#RRGGBB" или "#RRGGBBAA". Размеры в пикселях.
# Изменения применяются на лету по SIGHUP: pkill -HUP -x DE
# font          — шрифт менюбара (имя из fontconfig; SF Pro Display
#                 подгружается из fonts/ проекта).
# border        — толщина рамки окна.
# title_height  — высота заголовка окна.
# button_size   — диаметр круглых кнопок управления окном.
# button_gap    — зазор между кнопками.
# menu_bar_height — высота верхнего менюбара.
# dock_icon / dock_padding / dock_gap — иконки, отступы и зазор дока.
[design]
font = "SF Pro Display"
border = 2
title_height = 28
button_size = 11
button_gap = 6
menu_bar_height = 26
dock_icon = 48
dock_padding = 8
dock_gap = 6

# Скругление углов окон (px), 0 — прямые углы. Максимизированные окна
# тоже скруглены; поставь 0, если хочешь классическое «в край экрана».
corner_radius = 12
corner_radius_maximized = 12

# Окна в стиле GNOME Adwaita (dark): тёмный хедер, волосяная тёмная рамка
color_window_border   = "#101012FF"
color_window_body     = "#1E1E20FF"
color_title_focused   = "#363638FF"
color_title_unfocused = "#28282AFF"
color_border_hover    = "#3A3A3CFF"

color_btn_close    = "#FF5E57FF"
color_btn_minimize = "#FFBD2EFF"
color_btn_maximize = "#29C740FF"

color_bar_bg   = "#1C1F24B8"
color_bar_line = "#00000040"
color_bar_text = "#F5F5FAFF"
color_bar_icon = "#F2F2F7E6"

color_dock_bg        = "#1F1F24BF"
color_dock_idle      = "#80858FF2"
color_dock_active    = "#FFFFFFFF"
color_dock_minimized = "#595C66D9"
color_dock_sep       = "#80808559"
color_dock_dot       = "#FFFFFFE6"
